# STABILITY-FIRST hop baseline. Diagnosis (2026-06-21 cont.3): the clean s2 hopper was
# never actually stable — it converged at ~730/1000 episode length and fails nominal-
# deterministic survival (1/3), drifting up to 2.8 m and toppling. Root cause: the reward
# pays >6400 for hopping/tracking but only ~360 (6%) for staying upright/in-place, so the
# optimum is a vigorous-but-wobbly hop that accepts occasional falls (ang_vel_xy raw ~1553:
# the torso rocks hard every cycle).
#
# This config keeps the hop DRIVERS identical to s2 (hop_height 8.0, rhythm/sync/push/flight
# defaults) but TRIPLES the stability incentives so the converged optimum must be upright +
# in place: termination -100->-300, orientation -2->-5, ang_vel_xy -0.15->-0.5, position hold
# tracking_lin_vel 2->3 with a tighter sigma 0.3->0.2. Warm-started from clean s2. Comparison-
# ready: cadence FIXED at 1.8 Hz, apex target 0.12 (matches the future spring arm). If this
# survives 3/3 on nominal, it becomes the fair baseline and the spring is re-introduced on it.
name: g1_hop_stable_base
env_name: G1JoystickHop
seed: 1
domain_randomization: true
centered_dr: true                          # keep the nominal model an interior DR point (valid nominal eval)
num_timesteps: 150000000
env_overrides:
  reward_config.tracking_sigma: 0.2        # was 0.3 — sharper position/heading hold (kills drift)
  reward_config.max_foot_height: 0.22
  reward_config.hop_freq: 1.8              # FIXED cadence (Hz) — comparison-ready
  reward_config.hop_height_target: 0.12    # FIXED apex (m above standing) — comparison-ready
  reward_config.hop_height_var: 0.0016     # sigma 0.04 m (looser than the 0.0009 pin so chasing an exact apex isn't itself destabilizing)
reward_scales:
  termination: -300.0                      # was -100: falling must hurt (was only ~6% of reward)
  action_rate: -0.01
  dof_acc: -2.5e-7
  torques: -2.0e-5
  tracking_lin_vel: 3.0                     # was 2.0: stronger stay-in-place
  tracking_ang_vel: 2.0
  leg_symmetry: -2.0                        # keep the anti-spin/anti-diagonal-stance term
  orientation: -5.0                         # was -2.0: stay upright
  ang_vel_xy: -0.5                          # was -0.15: damp the torso rocking (largest instability signal)
  hop_height: 8.0                           # hop drivers UNCHANGED from s2 (do not suppress the hop)
  hop_overshoot: -20.0                      # apex cap (matches s2)
spring:
  kind: none
energy_reward_weight: 0.0
energy_motor: g1
ppo: {}
