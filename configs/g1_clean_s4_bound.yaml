# CLEAN-CURRICULUM Stage 4 — non-trivial SUPPORT EXCHANGE (alternating-foot bounding).
# Warm-start from stage 3. Switches to the anti-phase clock (G1JoystickBound, feet
# alternate) driven by a forward command. Adds the SWING-FOOT CLEARANCE fix for the
# leg-grazing the user noticed (the "swing" foot was grazing the floor, missed by the
# contact detection -> ambiguous alternation): feet_clearance penalizes the swing foot
# not reaching max_foot_height, and max_foot_height is RAISED so it clearly clears.
# leg_symmetry is OFF here (default 0) — an alternating gait is INHERENTLY fore-aft
# asymmetric, so the symmetry penalty would fight it; heading is held by the forward
# command instead (bounding already goes straight, 2026-06-20).
# GATE: clean alternating flight (BOTH feet clearly leave the floor, swing foot well
# elevated — verify the actual foot-floor gap vs the env's contact flag), forward motion, survival.
name: g1_clean_s4_bound
env_name: G1JoystickBound
seed: 1
domain_randomization: true
num_timesteps: 140000000
command_forward:
  vx_min: 0.4
  vx_max: 1.0
  vy_max: 0.0
  vyaw_max: 0.0
env_overrides:
  reward_config.tracking_sigma: 0.4
  reward_config.max_foot_height: 0.20      # raised -> swing foot must clearly clear the floor
reward_scales:
  termination: -50.0
  action_rate: -0.01
  dof_acc: -2.5e-7
  torques: -2.0e-5
  feet_clearance: -1.0                       # NEW vs the 2026-06-20 bounding: reward clear swing-foot lift
spring:
  kind: none
energy_reward_weight: 0.0
energy_motor: g1
ppo: {}
