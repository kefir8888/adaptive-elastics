# G1 hopping, BASELINE (no-spring) arm of the matched energy comparison.
# Warm-started from the S1 elicit checkpoint (--restore), fixed at S1's natural
# operating point (apex 0.09 m, cadence 1.9 Hz) so this and the spring arm perform
# the IDENTICAL mechanical task. BYTE-IDENTICAL to g1_hop_spring.yaml except the
# spring block. Energy penalty OFF: the fixed apex+cadence already forces matched
# output, so the spring's electrical saving is measured POST-HOC (the default Go1
# weight -2.5e-4 is ~50 reward units here and would crush the hop). The `torques`
# penalty (-1e-4, on motor torque, identical both arms) gives the torque-reduction
# incentive the spring exploits.
name: g1_hop_baseline
env_name: G1JoystickHop
seed: 1
domain_randomization: true
num_timesteps: 120000000        # warm-started -> short adaptation (~24 min on H100)
env_overrides:
  reward_config.tracking_sigma: 0.5
  reward_config.max_foot_height: 0.22
  reward_config.hop_freq: 1.9            # FIXED cadence (Hz) — S1's natural rate
  reward_config.hop_height_target: 0.09  # FIXED apex (m above standing) — S1's natural apex
reward_scales:
  termination: -100.0
  action_rate: -0.01
  dof_acc: -2.5e-7
  torques: -1.0e-4
spring:
  kind: none                              # THE ONLY DIFFERENCE from g1_hop_spring.yaml
energy_reward_weight: 0.0                 # measure electrical energy POST-HOC (both arms)
energy_motor: g1
ppo: {}
