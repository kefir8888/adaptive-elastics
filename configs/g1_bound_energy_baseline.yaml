# ENERGY-OBJECTIVE running BASELINE (no spring). Parity arm for the decisive spring CoT test.
# energy_reward_weight ON (-1.0e-3, calibrated: energy ~20% of s4 positive reward 2026/ep at ~479 W)
# so the gait OPTIMIZES electrical energy. FREE cadence (no hop_freq -> bound env samples 1.6-2.6).
# BYTE-IDENTICAL to g1_bound_energy_spring.yaml except the spring block. Warm-start from s4; train the
# SAME steps as the spring arm (parity -> removes the +100M training confound from the 2026-06-22 run).
name: g1_bound_energy_baseline
env_name: G1JoystickBound
impl: jax
seed: 1
num_timesteps: 120000000
domain_randomization: true
centered_dr: true        # nominal-centered DR: stock G1 DR puts nominal at the least-damped
                         # boundary so a DR-trained gait falls at nominal; centered DR fixes it
                         # (2026-06-22: omitting this made the spring 0/3 at nominal). Both arms.
spring:
  kind: none
ppo: {}
reward_scales:
  termination: -50.0
  action_rate: -0.01
  dof_acc: -2.5e-07
  torques: -2.0e-05
  feet_clearance: -1.0
env_overrides:
  reward_config.tracking_sigma: 0.4
  reward_config.max_foot_height: 0.2
energy_reward_weight: -1.0e-4   # SECONDARY efficiency bias (~4% of reward), NOT -1e-3 (~38%, which
                                # suppressed forward speed -> 0.09 m/s). Running/tracking must dominate
                                # so the robot actually RUNS; energy only breaks ties between runners.
energy_motor: g1
command_forward:
  vx_min: 0.4
  vx_max: 1.0
  vy_max: 0.0
  vyaw_max: 0.0
