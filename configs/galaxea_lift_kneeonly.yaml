# Galaxea R1 coordinated upright lift, spring on ONLY the middle torso joint (the "knee",
# torso_joint2 — the dominant load-bearer). Tests how much of the win one well-placed
# spring captures vs springing all three torso joints. (scripts/galaxea_lift.py)
urdf: humanoid/Galaxea/galaxea_r1_description/urdf/galaxea_r1.urdf
z_top: 0.95
z_bot: 0.62
cycle_s: 2.5
total_s: 20.0
dwell_frac: 0.15
dt: 0.004
ik_seed: [0.4, -0.8, -0.4]
motor: galaxea_torso
arm_motor: galaxea_arm
regen: false
spring_joints: [torso_joint2]                         # ONLY the middle "knee" joint
label: "Galaxea R1 (lift, spring on middle joint only)"
tag: "_kneeonly"
compute_w: 150.0
