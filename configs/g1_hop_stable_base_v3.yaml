# STABILITY-FIRST hop baseline v3. v2 SOLVED the topple (harder attitude penalties: surviving
# seeds end at 15-17 deg tilt vs s2's 70-126 deg face-plant; apex controlled ~0.12; nominal
# survival 2/3, up from 1/3). The ONLY remaining failure is DRIFT: every seed wanders 2-3.6 m
# and the one that fell did so by drifting 3.6 m. The Gaussian tracking_lin_vel carrot can't
# hold a slow steady ~0.14 m/s drift. v3 adds an explicit IN-PLACE ANCHOR: hop_stay penalizes
# horizontal DISPLACEMENT of the pelvis from its reset xy (ignores the natural hop sway, catches
# the net drift). Warm-started from the attitude-stable v2 -> it only needs to learn to not drift.
#   vs v2:  + hop_stay -5.0 (new env term),  tracking_sigma 0.2 -> 0.15.  All else identical to v2.
name: g1_hop_stable_base_v3
env_name: G1JoystickHop
seed: 1
domain_randomization: true
centered_dr: true
num_timesteps: 100000000
env_overrides:
  reward_config.tracking_sigma: 0.15        # was 0.2 — sharper velocity-based drift pressure too
  reward_config.max_foot_height: 0.20
  reward_config.hop_freq: 1.8
  reward_config.hop_height_target: 0.10
  reward_config.hop_height_var: 0.0016
reward_scales:
  termination: -400.0
  action_rate: -0.01
  dof_acc: -2.5e-7
  torques: -2.0e-5
  tracking_lin_vel: 3.0
  tracking_ang_vel: 2.0
  leg_symmetry: -2.0
  orientation: -8.0
  ang_vel_xy: -1.0
  feet_air_time: 1.0
  hop_flight: 0.5
  hop_height: 8.0
  hop_overshoot: -20.0
  hop_stay: -5.0                             # NEW: in-place anchor (penalize horizontal displacement, metres)
spring:
  kind: none
energy_reward_weight: 0.0
energy_motor: g1
ppo: {}
