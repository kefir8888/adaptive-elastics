# OPTION A spring arm: knee pogo on the best in-place base (v2, 2/3 nominal, attitude-stable).
# BYTE-IDENTICAL to configs/g1_hop_stable_base_v2.yaml (the no-spring BASELINE arm) except the
# spring block. Warm-started from v2 and trained via a staged stiffness ramp (driver overrides
# --spring_k 40 -> 75 -> 95.8) so the gait migrates to full strength without destabilizing.
# Spring re-fit from the v2 work-loop (knee braking -39 W; the recovery channel). Matched task:
# hop_freq 1.8 + hop_height_target 0.10 identical to the baseline -> fair energy comparison.
# Tests the core question: does a much better base (vs the 1/3 s2 that gave 0/3) let the spring hold?
name: g1_hop_v2_spring
env_name: G1JoystickHop
seed: 1
domain_randomization: true
centered_dr: true
num_timesteps: 60000000
env_overrides:
  reward_config.tracking_sigma: 0.2
  reward_config.max_foot_height: 0.20
  reward_config.hop_freq: 1.8
  reward_config.hop_height_target: 0.10
  reward_config.hop_height_var: 0.0016
reward_scales:
  termination: -400.0
  action_rate: -0.01
  dof_acc: -2.5e-7
  torques: -2.0e-5
  tracking_lin_vel: 3.0
  tracking_ang_vel: 2.0
  leg_symmetry: -2.0
  orientation: -8.0
  ang_vel_xy: -1.0
  feet_air_time: 1.0
  hop_flight: 0.5
  hop_height: 8.0
  hop_overshoot: -20.0
spring:
  kind: one_sided_linear                   # knee pogo: engages in flexion (landing/crouch), returns at push-off
  joint: knee
  theta_engage: 0.542                       # re-fit from the v2 work-loop
  engage_sign: 1.0
  k: 95.8                                    # final stiffness; the ramp driver overrides per stage
energy_reward_weight: 0.0
energy_motor: g1
ppo: {}
