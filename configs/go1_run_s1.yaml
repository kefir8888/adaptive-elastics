# Go1 RUNNING — Stage 1 (warm-start trot). Raises the joystick command AMPLITUDE (command_config.a,
# NOT lin_vel_x — that is a G1 field) to push the dog into a fast trot. Warm-start from the flat
# walker via --restore (the pipeline). Stock rewards — NO reward surgery (the G1 lesson). Gate: stable
# trot. See docs/dog_running_design.md.
name: go1_run_s1
env_name: Go1JoystickFlatTerrain
seed: 1
domain_randomization: true
env_overrides:
  command_config.a: [2.2, 0.5, 0.8]   # x/y/yaw command amplitude; stock [1.5, 0.8, 1.0]. Push forward, trim turning.
spring:
  kind: none
energy_reward_weight: -1.0e-4
energy_motor: go1_knee
ppo: {}
