# Go1 RUNNING — Stage 1 (warm-start trot). Raises the joystick command AMPLITUDE (command_config.a,
# NOT lin_vel_x — that is a G1 field) to push the dog into a fast trot. Stock rewards — NO reward
# surgery (the G1 lesson). Gate: stable trot. See docs/dog_running_design.md.
#
# WARM-START: there is no warm-start FIELD in the config — the trainer takes the source checkpoint as
# a command-line flag. Train the S0 walker (configs/go1_run_s0_walker.yaml) first, then launch S1 from its
# run directory with:
#   pea-train --config configs/go1_run_s1.yaml --restore <S0_walker_run_dir>
# (--restore restores the weights and restarts the step counter; the budget below is the FULL S1 run.)
name: go1_run_s1
env_name: Go1JoystickFlatTerrain
seed: 1
domain_randomization: true
num_timesteps: 100000000   # ~100 M (design: S1 ~80-150 M warm-started from the walker)
env_overrides:
  command_config.a: [2.2, 0.5, 0.8]   # x/y/yaw command amplitude; stock [1.5, 0.8, 1.2]. Push forward, trim turning.
spring:
  kind: none
energy_reward_weight: -1.0e-4
energy_motor: go1_knee
ppo: {}
