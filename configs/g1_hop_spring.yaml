# G1 hopping, SPRING arm of the matched energy comparison.
# BYTE-IDENTICAL to g1_hop_baseline.yaml except the spring block below. Warm-started
# from the SAME S1 elicit checkpoint (--restore), same fixed task (apex 0.09 m,
# cadence 1.9 Hz), same energy-off / post-hoc measurement. The ONLY difference is the
# parallel pogo knee spring.
#
# Spring = one-sided-linear (pogo): engages as the knee flexes past theta_engage
# (landing/crouch), storing energy, and returns it on extension (push-off). Params
# FITTED from the S1 hop knee work-loop (scripts/hop_spring_prep.py): the knee
# dissipates ~61 W of braking power (both legs) under no-regen — the energy this
# spring recovers. If a full-strength injection shocks the warm-started gait (reward
# collapses in the first evals), switch to DR-over-k (spring.k_dr) to ramp it in.
name: g1_hop_spring
env_name: G1JoystickHop
seed: 1
domain_randomization: true
num_timesteps: 120000000
env_overrides:
  reward_config.tracking_sigma: 0.5
  reward_config.max_foot_height: 0.22
  reward_config.hop_freq: 1.9
  reward_config.hop_height_target: 0.09
  reward_config.hop_height_var: 0.0009   # MUST match the baseline arm (pinned apex)
reward_scales:
  termination: -100.0
  action_rate: -0.01
  dof_acc: -2.5e-7
  torques: -1.0e-4
  hop_height: 8.0                        # MUST match the baseline arm
  hop_overshoot: -30.0                   # MUST match the baseline arm — caps the apex for fairness
spring:
  kind: one_sided_linear                  # pogo: engages in flexion, returns at push-off
  joint: knee                             # the knee carries 8x the ankle's recoverable braking
  theta_engage: 0.827                     # fitted: flexion onset of the loaded branch
  engage_sign: 1.0                        # fitted: engages as the knee flexes past theta_engage
  k: 106.1                                # fitted N*m/rad; the FIXED strength used at EVAL (k_dr off)
  # GRADUAL RAMP-IN (2026-06-20 re-run): the full-strength k=106 injected onto the no-spring
  # warm-start destabilized the gait (fell 2/3 deterministic eval seeds, overshot apex). Randomize
  # k ~ U(0, 106) per episode so the policy adapts to the spring's energy across the whole range
  # (the familiar k~=0 anchors it, high k teaches regulation). For the energy comparison, eval at
  # the FIXED k=106 (k_dr off) — the policy has seen full strength in-distribution.
  k_dr: true
  k_dr_min: 0.0
  k_dr_max: 106.1
energy_reward_weight: 0.0
energy_motor: g1
ppo: {}
