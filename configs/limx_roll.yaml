# LimX W1 (WL_P311D) wheeled-quadruped rolling-energy experiment (scripts/limx_roll.py).
# 20 s roll on flat ground; constant per-leg knee (calf/KFE) preload spring offloads the
# constant-sign stance holding torque. Wheel transport billed analytically (Crr*m*g*d).
torso_mass_kg: 17.0        # ESTIMATE (no official W1 mass; ~40 kg total press estimate);
                           # model legs ~24.5 kg + this base -> ~41 kg total.
crr: 0.015                 # rolling-resistance coeff, rubber/PU wheel on concrete
wheel_radius: 0.127        # m (model wheel geom)
wheel_speed: 6.0           # rad/s (-> ~0.76 m/s)
settle_s: 2.0
drive_s: 18.0              # 20 s total
dt: 0.002
knee_motor: limx_knee      # leg joints (joint-side R/Kt^2 ~ 0.027)
wheel_motor: limx_knee
regen: false
knee_preload: null         # null = auto (= measured baseline mean knee torque per leg)
compute_w: 150.0           # onboard computer power (headline); swept too
compute_sweep: [0.0, 50.0, 150.0, 300.0]
