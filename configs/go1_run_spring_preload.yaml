# Go1 RUNNING — Phase C spring arm (run + constant per-leg knee preload). The defensible arm: C3 +
# per-leg knee-preload domain randomization (preload_dr) so a blind policy learns robust-to-any-preload;
# the adaptive clipped-proportional controller (src/pea/control.py) sets the per-leg tau0 at EVAL. The
# spring is the ONLY difference from go1_run_c3.yaml — the forward-command block, every env override,
# reward tweak, energy weight, motor, and seed below is BYTE-IDENTICAL to C3 (parity). See
# docs/dog_running_design.md.
#
# WARM-START (command-line, not a config field): launch from the C3 run with
#   pea-train --config configs/go1_run_spring_preload.yaml --restore <C3_run_dir>
name: go1_run_spring_preload
env_name: Go1JoystickFlatTerrain
seed: 1
domain_randomization: true
num_timesteps: 120000000   # ~120 M, matching C3
command_forward:
  vx_min: 2.5
  vx_max: 3.2
  vy_max: 0.3
  vyaw_max: 0.4
env_overrides:
  reward_config.max_foot_height: 0.15
reward_scales:
  feet_air_time: 0.4
  lin_vel_z: -0.25
  feet_height: -0.05
  feet_clearance: -1.0
spring:
  kind: preload_dr
  joint: calf            # Go1 knee == calf joint
  # PLACEHOLDER: max per-leg preload for the U(0, tau0) per-episode draw. The real value comes from
  # the S3 work-loop analysis (the OFFSET of the calf torque-angle loop sets the constant preload).
  # TODO(S3): replace 8.0 with the offset-derived cap. 8.0 is a stand-in (the walking study used 12
  # for a 0-10 kg payload; the no-load runner needs less support torque, so a smaller cap is a guess).
  tau0: 8.0
energy_reward_weight: -1.0e-4
energy_motor: go1_knee
ppo: {}
