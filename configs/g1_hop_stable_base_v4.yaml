# STABILITY-FIRST hop baseline v4 = v2 + DEAD-ZONE in-place anchor. Bracketing so far:
#   v2 (no anchor):        nominal 2/3, drift 2.0-3.6 m  -> falls by drifting out.
#   v3 (anchor -5, no DZ): nominal 1/3, drift 0.7-1.9 m  -> falls by OVER-constraint (the stiff
#                          anchor suppressed the balance corrections; late gentle falls at low drift).
# v4 keeps v2's working attitude package (which solved the topple) and adds the anchor with a 0.3 m
# DEAD-ZONE: free balance corrections inside the circle, strong pull-back only beyond it -> low net
# drift AND room to catch balance. tracking_sigma back to 0.2 (v3's 0.15 also over-constrained).
# Warm-started from the 2/3 v2 (NOT the over-constrained v3).
name: g1_hop_stable_base_v4
env_name: G1JoystickHop
seed: 1
domain_randomization: true
centered_dr: true
num_timesteps: 100000000
env_overrides:
  reward_config.tracking_sigma: 0.2         # back to v2 (v3's 0.15 over-constrained velocity)
  reward_config.max_foot_height: 0.20
  reward_config.hop_freq: 1.8
  reward_config.hop_height_target: 0.10
  reward_config.hop_height_var: 0.0016
reward_scales:
  termination: -400.0
  action_rate: -0.01
  dof_acc: -2.5e-7
  torques: -2.0e-5
  tracking_lin_vel: 3.0
  tracking_ang_vel: 2.0
  leg_symmetry: -2.0
  orientation: -8.0
  ang_vel_xy: -1.0
  feet_air_time: 1.0
  hop_flight: 0.5
  hop_height: 8.0
  hop_overshoot: -20.0
  hop_stay: -5.0                             # anchor strength BEYOND the 0.3 m dead-zone (env: HOP_STAY_DEADZONE)
spring:
  kind: none
energy_reward_weight: 0.0
energy_motor: g1
ppo: {}
